# One account per workload. The RBAC control turns off token mounting; the careless baseline leaves it on.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: web
  labels:
    app.kubernetes.io/name: web
    app.kubernetes.io/part-of: tenant
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: db
  labels:
    app.kubernetes.io/name: db
    app.kubernetes.io/part-of: tenant
