# Who this team is: its people's group, its service name, and the names of its cluster-scoped objects.
# Listed last among a team's components, so the objects it patches already exist.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
patches:
  - target:
      kind: RoleBinding
      name: developers
    patch: |-
      - op: replace
        path: /subjects/0/name
        value: team-a-humans
  - target:
      kind: ClusterRoleBinding
      name: convenience
    patch: |-
      - op: replace
        path: /metadata/name
        value: team-a-convenience
      - op: replace
        path: /subjects/0/name
        value: team-a-humans
      - op: replace
        path: /subjects/1/namespace
        value: team-a
  - target:
      kind: Deployment
      name: web
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env/0/value
        value: team-a
